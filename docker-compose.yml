services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/prisma/prod.db"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
    volumes:
      # Persist the SQLite database across container restarts and re-deploys
      - db_data:/app/prisma
    restart: unless-stopped

volumes:
  db_data:
